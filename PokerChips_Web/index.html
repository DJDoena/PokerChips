<!DOCTYPE HTML>
<html lang="de">
    <head>
        <title>Poker Chips</title>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width; initial-scale=1" />
        <script src="PokerChipsSolver.js"></script>
        <script src="PokerChips.js"></script>
        <style>
            #pokerTable td, #pokerTable th
            {
                padding: 4px 15px;
            }
        </style>
    </head>
    <body style="font-family: Verdana, Geneva, sans-serif;">
        <form>
            <table id="pokerTable" style="border: 0px;">
                <tr>
                    <td>Spieler:</td>
                    <td><input type="number" id="amountPlayers" min="2" max="10" value="5" /></td>
                </tr>
                <tr>
                    <td>Stack-Gr&ouml;&szlig;e je Spieler:</td>
                    <td><input type="number" id="stackSize" min="1000" max="10000" value="5000" /></td>
                </tr>
                <tr>
                    <td>Maximum Chips je Wert:</td>
                    <td><input type="number" id="maxChips" min="10" max="300" value="20" /></td>
                </tr>
                <tr>
                    <td><input type="button" value="Koffer laden &quot;Ein 500er (normal)&quot;" onClick="setOneNormal500Case();" style="width: 95%;" /></td>
                    <td></td>
                </tr>
                <tr>
                    <td><input type="button" value="Koffer laden &quot;Ein 500er (voll)&quot;" onClick="setOneFull500Case();" style="width: 95%;" /></td>
                    <td></td>
                </tr>
                <tr>
                    <td><input type="button" value="Koffer laden &quot;Zwei 500er (voll)&quot;" onClick="setTwo500Case();" style="width: 95%;" /></td>
                    <td></td>
                </tr>
                <tr>
                    <th>Gesamt Chips im Koffer je Wert:</th>
                    <th>Chip Wert:</th>
                </tr>
                <tr id="calculateRow">
                    <td><input type="button" value="Berechnen" onClick="calculate('de');" style="width: 95%;" /></td>
                </tr>
            </table>
            <script>
                for(let caseIndex = 0; caseIndex < NumberOfCaseChipColors; caseIndex++)
                {
                    addCaseRow(caseIndex);
                }
            </script>
        </form>
		<p>
			<a href="en/index.html">in English</a>
		</p>
    </body>
</html>
